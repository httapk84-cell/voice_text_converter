name: voice_text_converter
description: Convert text to speech and save as MP3.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_tts: ^0.10.0
  permission_handler: ^11.4.3
  path_provider: ^2.1.1
  intl: ^0.19.0
  file_picker: ^6.0.0
  share_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/